<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffc400">
  <title>經營 Team 營運協同平台</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23ffc400'/><text x='50' y='70' font-size='62' text-anchor='middle'>🚲</text></svg>">
  <link rel="stylesheet" href="css/style.css?v=20261020v3">
  <!-- 月曆元件（CDN，不需 npm） -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js" defer></script>
  <script>
    function _escHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    window.onerror = function(msg, url, line) {
      var d = document.getElementById('app');
      if (d) d.innerHTML = '<div style="padding:24px;color:#dc2626;font-family:sans-serif;"><h3>⚠️ 載入出錯</h3><p>' + _escHtml(msg) + '</p><small>' + _escHtml(url || '') + ':' + _escHtml(line) + '</small></div>';
    };
    window.addEventListener('unhandledrejection', function(e) {
      var d = document.getElementById('app');
      var r = String((e.reason && (e.reason.stack || e.reason.message)) || e.reason || '');
      if (r.indexOf('does not provide an export') !== -1 && !sessionStorage.getItem('_reloaded_mod_v6')) {
        sessionStorage.setItem('_reloaded_mod_v6', '1');
        location.reload();
        return;
      }
      if (d) d.innerHTML = '<div style="padding:24px;color:#dc2626;font-family:sans-serif;"><h3>⚠️ 載入出錯 (Promise Rejection)</h3><p>' + _escHtml(r) + '</p></div>';
    });
  </script>
</head>
<body>
  <div id="app"><div class="boot">載入中…</div></div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script type="module" src="js/app.js?v=20261020v3"></script>
</body>
</html>
