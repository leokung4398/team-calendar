<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffc400">
  <title>經營 Team 營運協同平台</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23ffc400'/><text x='50' y='70' font-size='62' text-anchor='middle'></text></svg>">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://api.open-meteo.com">
  <link rel="dns-prefetch" href="https://zh.wikipedia.org">
  <link rel="stylesheet" href="css/style.css?v=20261023v61">
  <script>
    // 手機端第一時間防護：
    // 1. 若手機從 github.io 或 .web.app 進入，自動導向與 authDomain 完全同源的 https://team-calendar-93cb2.firebaseapp.com/
    //    既符合 Google Cloud 預設 Authorized Redirect URI（不會出現 400 redirect_uri_mismatch），也徹底避開 iOS Storage Partitioning 造成的 "Unable to process request due to missing initial state"
    // 2. 若從 LINE 點開且未帶 openExternalBrowser=1，立即自動附加參數喚起系統預設瀏覽器（Safari / Chrome）
    (function() {
      try {
        var savedTheme = localStorage.getItem('yb_ui_theme') || 'classic';
        document.documentElement.setAttribute('data-theme', savedTheme);
      } catch (e) {}
      try {
        var ua = navigator.userAgent || '';
        var isLine = /Line\//i.test(ua);
        var isMobile = /iPhone|iPad|iPod|Android/i.test(ua);
        var host = location.hostname || '';
        if (isMobile && (/github\.io$/i.test(host) || /\.web\.app$/i.test(host))) {
          location.replace('https://team-calendar-93cb2.firebaseapp.com/?openExternalBrowser=1' + (location.hash || ''));
          return;
        }
        if (isLine && location.search.indexOf('openExternalBrowser=1') === -1) {
          var sep = location.search ? '&' : '?';
          location.replace(location.pathname + location.search + sep + 'openExternalBrowser=1' + (location.hash || ''));
          return;
        }
      } catch (err) {}
    })();
  </script>
  <!-- 月曆元件（CDN，不需 npm） -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js" defer></script>
  <script>
    function _escHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    window.onerror = function(msg, url, line) {
      var d = document.getElementById('app');
      if (d) d.innerHTML = '<div style="padding:24px;color:#dc2626;font-family:sans-serif;"><h3>載入出錯</h3><p>' + _escHtml(msg) + '</p><small>' + _escHtml(url || '') + ':' + _escHtml(line) + '</small></div>';
    };
    window.addEventListener('unhandledrejection', function(e) {
      var d = document.getElementById('app');
      var r = String((e.reason && (e.reason.stack || e.reason.message)) || e.reason || '');
      if (r.indexOf('does not provide an export') !== -1 && !sessionStorage.getItem('_reloaded_mod_v58')) {
        sessionStorage.setItem('_reloaded_mod_v58', '1');
        location.reload();
        return;
      }
      if (d) d.innerHTML = '<div style="padding:24px;color:#dc2626;font-family:sans-serif;"><h3>載入出錯 (Promise Rejection)</h3><p>' + _escHtml(r) + '</p></div>';
    });
  </script>
</head>
<body>
  <div id="app"><div class="boot">載入中…</div></div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script type="module" src="js/app.js?v=20261023v61"></script>
</body>
</html>
